name: Build And Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]  # 仅向main分支推送时触发（含合并分支/PR合并）
    tags: []  # 清空tag触发（彻底禁用tag触发）

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      
      - name: Set time zone
        uses: szenius/set-timezone@v1.0
        with:
          timezoneLinux: "Asia/Shanghai"
          timezoneMacos: "Asia/Shanghai"
          timezoneWindows: "China Standard Time"

      - name: Generate version tag (date + time)
        id: gen_version
        run: |
          VERSION=$(date +"%Y%m%d-%H%M")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/qq-farm-bot
          tags: |
            type=raw,value=${{ steps.gen_version.outputs.version }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./core/Dockerfile
          # Dockerfile 使用的 node:20-alpine 原生支持这两个架构
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
